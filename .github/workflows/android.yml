name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "tools/patch-capacitor-android.mjs"
      - "tools/android-webview-smoke.mjs"
      - ".github/workflows/android.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      VITE_API_ORIGIN: https://stream.merith.me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Probe production backend from CI
        run: |
          URL='https://stream.merith.me/api/v1/catalog/public?kind=all&mode=trending&limit=1&page=1'
          echo '=== Default curl ==='
          curl -sS -o /tmp/backend-default.body -D /tmp/backend-default.headers -w 'HTTP %{http_code}\n' "$URL" || true
          head -n 30 /tmp/backend-default.headers || true
          head -c 500 /tmp/backend-default.body || true
          echo
          echo '=== Browser-like headers ==='
          curl -sS -o /tmp/backend-browser.body -D /tmp/backend-browser.headers -w 'HTTP %{http_code}\n' \
            -H 'User-Agent: Mozilla/5.0 (Linux; Android 15; Pixel 6) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36' \
            -H 'Accept: application/json,text/plain,*/*' \
            "$URL" || true
          head -n 30 /tmp/backend-browser.headers || true
          head -c 500 /tmp/backend-browser.body || true
          echo

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install web dependencies
        run: npm ci
      - name: Install Capacitor toolchain without changing lockfile
        run: npm run android:deps
      - name: Build frontend
        run: npm run build:client
      - name: Create Android project and apply native window polish
        run: npm run android:add
      - name: Sync frontend into Android
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meristream-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop me.merith.meristream
            adb shell am start -W -n me.merith.meristream/.MainActivity
            sleep 18

            # Initial catalog/native-shell screenshot.
            adb shell uiautomator dump /sdcard/meristream-window.xml || true
            adb pull /sdcard/meristream-window.xml meristream-window.xml || true
            adb exec-out screencap -p > meristream-emulator.png || true

            # Attach Chrome DevTools Protocol to the debug WebView. This lets CI
            # inspect the same React tree rendered by the installed APK.
            SOCKET="$(adb shell cat /proc/net/unix | grep -o 'webview_devtools_remote_[^ ]*' | head -1 | tr -d '\r')"
            test -n "$SOCKET"
            adb forward tcp:9222 "localabstract:$SOCKET"
            node tools/android-webview-smoke.mjs state

            # Visual audit of the native bottom-sheet navigation.
            node tools/android-webview-smoke.mjs open-menu
            sleep 1
            adb exec-out screencap -p > meristream-menu.png
            node tools/android-webview-smoke.mjs close-menu

            # Real Android WebView playback smoke. This route uses a public
            # multi-bitrate HLS stream so Cloudflare cannot mask player regressions.
            node tools/android-webview-smoke.mjs open-player
            node tools/android-webview-smoke.mjs play
            sleep 5
            adb exec-out screencap -p > meristream-player.png
            node tools/android-webview-smoke.mjs assert-player

            adb logcat -d > meristream-logcat.txt || true
            adb shell dumpsys activity activities | grep -E "topResumedActivity=.*me.merith.meristream/.MainActivity"
            ! grep -E "FATAL EXCEPTION.*me\.merith\.meristream|Process: me\.merith\.meristream" meristream-logcat.txt

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meristream-android-emulator-evidence
          path: |
            meristream-emulator.png
            meristream-menu.png
            meristream-player.png
            meristream-window.xml
            meristream-logcat.txt
          if-no-files-found: warn
