name: Apply playback integration

on:
  push:
    branches:
      - integrate/immersive-ui-provider-v2
    paths:
      - tools/apply-playback-integration.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/immersive-ui-provider-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact-source patch
        run: node tools/apply-playback-integration.mjs
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Focused playback tests
        run: npx vitest run src/utils/playbackBootstrap.test.ts src/utils/playerLanguages.test.ts
      - name: Production build
        run: npm run build
      - name: Commit validated integration
        run: |
          if git diff --quiet -- src/App.tsx src/components/HLSPlayerModal.tsx; then
            echo "No integration changes were necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/HLSPlayerModal.tsx
          git commit -m "feat(player): integrate non-blocking playback bootstrap"
          git push origin HEAD:integrate/immersive-ui-provider-v2
