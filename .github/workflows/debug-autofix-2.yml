name: Debug autofix 2

on:
  push:
    branches: [feat/provider-v2-es-multilang]
    paths:
      - .github/workflows/debug-autofix-2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-v2-es-multilang
      - name: Apply backend fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const edit = (path, fn) => {
            const before = fs.readFileSync(path, 'utf8');
            const after = fn(before);
            if (after !== before) fs.writeFileSync(path, after);
            else console.log(`no-op: ${path}`);
          };

          edit('server/resolvers.ts', (s) => {
            if (!s.includes('const VIMEOS_EMBED_TIMEOUT_MS')) {
              s = s.replace(/(const FETCH_UA\s*=\s*\n\s*"[^"]+";)/, '$1\nconst VIMEOS_EMBED_TIMEOUT_MS = 8_000;');
            }
            s = s.replace(/\n\s*\/\/ Si la resolución interna no produjo stream directo \(quedó como embed\), intentar con yt-dlp[\s\S]*?\n\s*const resolvedExpiry/, '\n\n    const resolvedExpiry');
            s = s.replace(/\n\s*try \{\n\s*const ytdlp = await resolveWithYtDlp\(rawUrl\);[\s\S]*?\n\s*\} catch \{\}\n\s*return rawUrl;/, '\n      return rawUrl;');
            s = s.replace('// 2. VIMEOS.NET: master.m3u8 directo vía desempaquetado/GET validado; fallback a yt-dlp\n    // si falla (nunca devolver /d/{id}_h: es una página HTML de descarga no jugable)', '// 2. VIMEOS.NET: master.m3u8 directo vía desempaquetado/GET validado.\n    // Nunca devolver /d/{id}_h: es una página HTML de descarga no jugable.');
            if (s.includes('resolveWithYtDlp')) throw new Error('resolveWithYtDlp remains');
            if (!s.includes('const VIMEOS_EMBED_TIMEOUT_MS = 8_000;')) throw new Error('Vimeos timeout missing');
            return s;
          });

          edit('server/resolvers/hianimesResolver.ts', (s) =>
            s.replace('  return normalizeAnimeRecord(raw.anime ?? payload);', '  return normalizeAnimeRecord(raw.anime ?? payload) ?? null;')
          );

          edit('server/scrapers/BaseAdapter.ts', (s) => {
            s = s.replace('  protected async fetchHtml(url: string, timeoutMs: number = 7500): Promise<string | null> {', '  protected async fetchHtml(url: string, timeoutMs: number = 7500, extraHeaders: Record<string, string> = {}): Promise<string | null> {');
            s = s.replace('        headers: COMMON_HEADERS,', '        headers: { ...COMMON_HEADERS, ...extraHeaders },');
            return s;
          });

          edit('server/scrapers/adapters/GenericAdapter.ts', (s) => {
            s = s.replace('  readonly id = "generic";', '  readonly id: string = "generic";');
            s = s.replace('  readonly name = "Universal Semantic Scraper (Fallback)";', '  readonly name: string = "Universal Semantic Scraper (Fallback)";');
            s = s.replace(/let cards = \$\(\[\]\);/g, 'let cards = $("__meristream_no_match__");');
            s = s.replace('if (detectedKind === "movie" || detectedKind === "open_archive")', 'if (detectedKind === "movie")');
            s = s.replace(/cheerio\.Element/g, 'any');
            s = s.replace(/  private resolveRelativeUrl\(url: string \| null \| undefined, baseUrl: string\): string \| null \{[\s\S]*?\n  \}\n\n  private async handleSearchTerm/, `  protected override resolveRelativeUrl(url: string, baseUrl: string): string {\n    if (!url) return "";\n    if (url.startsWith("http")) return url;\n    if (url.startsWith("//")) return \`https:\${url}\`;\n    try { return new URL(url, baseUrl).toString(); } catch { return url; }\n  }\n\n  private async handleSearchTerm`);
            return s;
          });

          edit('server/scrapers/adapters/AnimeFlvAdapter.ts', (s) => {
            s = s.replace(/let cards = \$\(\[\]\);/g, 'let cards = $("__meristream_no_match__");');
            s = s.replace(/cheerio\.Element/g, 'any');
            s = s.replace(/  private resolveRelativeUrl\(url: string \| null \| undefined, baseUrl: string\): string \| null \{[\s\S]*?\n  \}\n\n  private async fallbackSearch/, `  protected override resolveRelativeUrl(url: string, baseUrl: string): string {\n    if (!url) return "";\n    if (url.startsWith("http")) return url;\n    if (url.startsWith("//")) return \`https:\${url}\`;\n    try { return new URL(url, baseUrl).toString(); } catch { return url; }\n  }\n\n  private async fallbackSearch`);
            return s;
          });

          edit('server/scrapers/adapters/DoramasflixAdapter.ts', (s) => {
            s = s.replace('  private resolveRelativeUrl(relative: string, base: string): string {', '  protected override resolveRelativeUrl(relative: string, base: string): string {');
            s = s.replace('    let controller: AbortController | null = null;\n    let timer: NodeJS.Timeout | null = null;\n    try {\n      controller = new AbortController();\n      timer = setTimeout(() => controller.abort(), 3500);', '    const controller = new AbortController();\n    let timer: NodeJS.Timeout | null = null;\n    try {\n      timer = setTimeout(() => controller.abort(), 3500);');
            return s;
          });

          edit('server/scrapers/adapters/LaMovieAdapter.ts', (s) => {
            s = s.replace(/if \(!xml\) return null;/g, 'if (!xml) return [];');
            s = s.replace(/if \(!raw\) return null;/g, 'if (!raw) return [];');
            return s;
          });

          edit('server/scrapers/adapters/TioPlusAdapter.ts', (s) =>
            s.replace('      const kind = this.kindFromTypeItem(typeClass) || this.kindFromUrl(fullUrl);', '      const kind = this.kindFromTypeItem(typeClass) || this.kindFromUrl(fullUrl) || undefined;')
          );

          edit('server/metadataEngine.ts', (s) => {
            s = s.replace('.filter((value): value is string => typeof value === "string" && value.trim());', '.filter((value): value is string => typeof value === "string" && Boolean(value.trim()));');
            s = s.replace('rankedCandidates.find(({ candidate }) => candidate === bestResult)?.score || 0,', 'rankedCandidates.find((entry: { candidate: any; score: number }) => entry.candidate === bestResult)?.score || 0,');
            s = s.replace('.filter((g): g is string => Boolean(g));', '.filter((g: string | undefined): g is string => Boolean(g));');
            s = s.replace('async function fillWeakDescription(meta: EnrichedMetadata, kindHint: string, query: string): Promise<EnrichedMetadata> {', 'async function fillWeakDescription(meta: EnrichedMetadata, kindHint: string | undefined, query: string): Promise<EnrichedMetadata> {');
            s = s.replace(/const json: unknown = await res\.json\(\);\s*if \(json\?\.data && json\.data\.length > 0\) \{\s*const attr = json\.data\[0\]\.attributes \|\| \{\};/, 'const json = await res.json() as { data?: Array<{ attributes?: Record<string, any> }> };\n      if (Array.isArray(json.data) && json.data.length > 0) {\n        const attr = json.data[0]?.attributes || {};');
            return s;
          });

          edit('server/scrapers/adapters/GnulaAdapter.ts', (s) =>
            s.replace(/\n    if \(explicitType === "catalog"\) \{\n      \/\/ La rama de catálogo anterior ya retornó arriba\.[\s\S]*?\n    \}\n\n    \/\/ Para fichas GNULA/, '\n\n    // Para fichas GNULA')
          );

          edit('server/catalogIntegrity.ts', (s) =>
            s.replace('  [key: string]: unknown;\n', '')
          );
          NODE
      - name: Commit source fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git commit -m 'fix: resolve CI-discovered backend defects'
          git push origin HEAD:feat/provider-v2-es-multilang
