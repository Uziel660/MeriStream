name: Final backend type fixes

on:
  push:
    branches: [feat/provider-v2-es-multilang]
    paths:
      - .github/workflows/debug-final-typefix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-v2-es-multilang
      - name: Patch remaining type errors
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const gnulaPath = 'server/scrapers/adapters/GnulaAdapter.ts';
          let gnula = fs.readFileSync(gnulaPath, 'utf8');
          const gnulaBefore = '    try { detailHtml = await this.fetchHtml(input, 12000); } catch {}';
          const gnulaAfter = '    try { detailHtml = (await this.fetchHtml(input, 12000)) || ""; } catch {}';
          if (!gnula.includes(gnulaBefore)) throw new Error('GNULA target not found');
          gnula = gnula.replace(gnulaBefore, gnulaAfter);
          fs.writeFileSync(gnulaPath, gnula);

          const laMoviePath = 'server/scrapers/adapters/LaMovieAdapter.ts';
          let laMovie = fs.readFileSync(laMoviePath, 'utf8');
          const wrong = '      const raw = await this.fetchHtml(apiUrl, 8000);\n      if (!raw) return [];';
          const matches = laMovie.split(wrong).length - 1;
          if (matches !== 2) throw new Error(`Expected 2 LaMovie targets, found ${matches}`);
          laMovie = laMovie.split(wrong).join('      const raw = await this.fetchHtml(apiUrl, 8000);\n      if (!raw) return null;');
          fs.writeFileSync(laMoviePath, laMovie);
          NODE
      - name: Commit source fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/scrapers/adapters/GnulaAdapter.ts server/scrapers/adapters/LaMovieAdapter.ts
          git commit -m 'fix: correct GNULA and LaMovie nullable returns'
          git push origin HEAD:feat/provider-v2-es-multilang
