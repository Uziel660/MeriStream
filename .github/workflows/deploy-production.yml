name: Deploy production

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: meristream-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Update Oracle and restart Compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          port: 22
          command_timeout: 40m
          script_stop: true
          script: |
            set -Eeuo pipefail
            cd /opt/meristream
            git config --global --add safe.directory /opt/meristream
            if ! git remote get-url origin >/dev/null 2>&1; then
              git remote add origin https://github.com/Uziel660/MeriStream.git
            fi
            git fetch --prune origin main
            git checkout -B main origin/main
            git reset --hard origin/main
            docker compose up -d --build --remove-orphans
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error http://127.0.0.1:3010/health >/tmp/meristream-health.json; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                docker compose ps
                exit 1
              fi
              sleep 5
            done
            test "$(cat /tmp/meristream-health.json)" != ""
            adapters="$(curl --fail --silent --show-error http://127.0.0.1:3010/api/v1/scraper/adapters)"
            printf '%s' "$adapters" | grep -q 'lamovie.online'
            docker compose ps
