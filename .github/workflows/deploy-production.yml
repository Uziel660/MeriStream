name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ssh_port:
        description: "Puerto SSH de la instancia Oracle (si no se usa SERVER_PORT)"
        required: false
        default: "22"
        type: string
  push:
    branches: [main]

concurrency:
  group: meristream-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Detect reachable Oracle SSH port
        id: ssh_preflight
        env:
          TARGET_HOST: ${{ secrets.SERVER_HOST }}
          CONFIGURED_PORT: ${{ inputs.ssh_port || secrets.SERVER_PORT || '22' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          import socket

          host = os.environ["TARGET_HOST"].strip()
          configured = os.environ.get("CONFIGURED_PORT", "22").strip() or "22"
          candidates = []
          for raw in [configured, "22", "2222", "2022", "2200", "8022", "22222"]:
              try:
                  port = int(raw)
              except ValueError:
                  continue
              if 1 <= port <= 65535 and port not in candidates:
                  candidates.append(port)

          for port in candidates:
              try:
                  with socket.create_connection((host, port), timeout=5):
                      with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                          output.write(f"port={port}\n")
                      print("SSH endpoint reachable on a configured candidate port.")
                      raise SystemExit(0)
              except (OSError, ValueError):
                  continue

          raise SystemExit("No reachable SSH port found among the configured/common Oracle candidates.")
          PY
      - name: Update Oracle and restart Compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          port: ${{ steps.ssh_preflight.outputs.port }}
          command_timeout: 40m
          script_stop: true
          script: |
            set -Eeuo pipefail
            cd /opt/meristream
            git config --global --add safe.directory /opt/meristream
            if ! git remote get-url origin >/dev/null 2>&1; then
              git remote add origin https://github.com/Uziel660/MeriStream.git
            fi
            git fetch --prune origin main
            git checkout -B main origin/main
            git reset --hard origin/main
            export MERISTREAM_BUILD_SHA="$(git rev-parse HEAD)"
            docker compose up -d --build --remove-orphans
            if command -v systemctl >/dev/null 2>&1; then
              if [ "$(id -u)" -eq 0 ]; then
                bash tools/install-meristream-systemd.sh /opt/meristream
              elif sudo -n true >/dev/null 2>&1; then
                sudo bash tools/install-meristream-systemd.sh /opt/meristream
              else
                echo "systemd disponible, pero el usuario no puede instalar la unidad; Compose conservará restart: unless-stopped"
              fi
            fi
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error http://127.0.0.1:3010/health >/tmp/meristream-health.json; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                docker compose ps
                exit 1
              fi
              sleep 5
            done
            test "$(cat /tmp/meristream-health.json)" != ""
            version="$(curl --fail --silent --show-error http://127.0.0.1:3010/api/v1/version)"
            printf '%s' "$version" | grep -q "$MERISTREAM_BUILD_SHA"
            adapters="$(curl --fail --silent --show-error http://127.0.0.1:3010/api/v1/scraper/adapters)"
            printf '%s' "$adapters" | grep -q 'lamovie.online'
            docker compose ps
