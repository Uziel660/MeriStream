name: Deploy MeriStream

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Rebuild containers
        run: docker compose down && docker compose up -d --build

      - name: Verify
        run: docker ps | grep meristream
