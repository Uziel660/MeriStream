name: Immersive UI Visual Audit

on:
  workflow_dispatch:
  push:
    branches: [integrate/immersive-ui-provider-v2]

concurrency:
  group: immersive-ui-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meristream_visual
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d meristream_visual"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meristream_visual?schema=public
      NODE_ENV: development
      MERISTREAM_URL: http://127.0.0.1:3010

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database
        run: npx prisma db push --schema=prisma/schema.prisma --skip-generate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start MeriStream
        run: |
          npm run dev > /tmp/meristream-visual.log 2>&1 &
          echo $! > /tmp/meristream-visual.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3010/ >/dev/null; then
              echo "MeriStream is ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/meristream-visual.log
          exit 1

      - name: Capture home and details
        run: node e2e/frontend_visual_audit.cjs

      - name: Capture preferences and player
        run: node e2e/immersive_player_visual_audit.cjs

      - name: Upload visual audit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: immersive-ui-visual-${{ github.sha }}
          path: |
            artifacts/frontend-visual/
            artifacts/immersive-player-visual/
          if-no-files-found: error
          retention-days: 14

      - name: Show server log on failure
        if: ${{ failure() }}
        run: cat /tmp/meristream-visual.log || true
