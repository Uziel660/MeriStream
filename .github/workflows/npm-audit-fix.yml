name: NPM Audit Fix

on:
  push:
    branches: [feat/provider-v2-es-multilang]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-v2-es-multilang
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply safe audit fixes
        run: npm audit fix
      - name: Show dependency changes
        run: git diff -- package-lock.json package.json
      - name: Commit safe audit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          if git diff --cached --quiet; then
            echo "No safe audit fixes available"
            exit 0
          fi
          git commit -m "fix: apply safe npm audit updates"
          git push origin HEAD:feat/provider-v2-es-multilang
