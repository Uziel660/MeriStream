name: Provider V2 CI

on:
  pull_request:
    branches: [lastversion]
  push:
    branches: [feat/provider-v2-es-multilang]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meristream_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d meristream_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meristream_test?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare test database
        run: npx prisma db push --schema=prisma/schema.prisma --skip-generate
      - name: Provider V2 typecheck
        run: npx tsc -p tsconfig.provider-v2.json --noEmit
      - name: Full project typecheck
        run: npm run lint
      - name: Full unit test suite
        run: npm test
      - name: Production build
        run: npm run build
