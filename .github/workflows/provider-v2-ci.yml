name: Provider V2 CI

on:
  pull_request:
    branches: [main, lastversion]
  push:
    branches:
      - main
      - feat/provider-v2-es-multilang
      - integrate/immersive-ui-provider-v2
  workflow_dispatch:

concurrency:
  group: provider-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meristream_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d meristream_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meristream_test?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit (diagnostic)
        continue-on-error: true
        run: npm audit --audit-level=moderate
      - name: Prepare test database
        run: npx prisma db push --schema=prisma/schema.prisma --skip-generate
      - name: Bootstrap smoke test
        run: npm run bootstrap -- --dry-run --movies=0 --series=0 --anime=0 --skip-episodes
      - name: Ingest all smoke test
        run: npm run ingest:all -- --dry
      - name: Provider V2 typecheck
        run: npx tsc -p tsconfig.provider-v2.json --noEmit
      - name: Full project typecheck
        run: npm run lint
      - name: Full unit test suite
        run: npm test
      - name: Production build
        run: npm run build
