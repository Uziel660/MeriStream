name: Provider V2 CI

on:
  pull_request:
    branches: [lastversion]
  push:
    branches: [feat/provider-v2-es-multilang]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Provider V2 typecheck
        run: npx tsc -p tsconfig.provider-v2.json --noEmit
      - name: Full unit test suite
        run: npm test
      - name: Production build
        run: npm run build
