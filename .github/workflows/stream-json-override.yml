name: Stream JSON Override Test

on:
  push:
    branches: [feat/provider-v2-es-multilang]

permissions:
  contents: write

jobs:
  override:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-v2-es-multilang
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Add patched stream-json override
        run: npm pkg set overrides.stream-json=3.5.0
      - name: Regenerate lockfile
        run: npm install --package-lock-only
      - name: Verify clean install
        run: npm ci
      - name: Verify dependency tree
        run: npm ls stream-json @crawlee/core @crawlee/impit-client
      - name: Verify audit
        run: npm audit --audit-level=moderate
      - name: Commit override
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: override vulnerable stream-json dependency"
          git push origin HEAD:feat/provider-v2-es-multilang
