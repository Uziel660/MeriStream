name: Temporary Wire Provider Frontend

on:
  push:
    branches:
      - feat/provider-v2-es-multilang
    paths:
      - .github/workflows/temp-wire-provider-frontend.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-v2-es-multilang
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply frontend patch
        run: python tools/patch-provider-frontend.py
      - name: Direct provider contract tests
        run: npx vitest run server/providers/api/types.test.ts
      - name: Typecheck
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit frontend integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/types.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: prefer direct TMDB providers in playback"
          git push origin HEAD:feat/provider-v2-es-multilang
