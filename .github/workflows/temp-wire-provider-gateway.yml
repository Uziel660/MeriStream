name: Temporary Wire Provider Gateway

on:
  push:
    branches: [feat/provider-v2-es-multilang]
    paths:
      - .github/workflows/temp-wire-provider-gateway.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-v2-es-multilang
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch server entrypoint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server.ts')
          text = p.read_text()
          import_marker = 'import { recommendationsRouter } from "./server/recommendations";\n'
          import_line = 'import { providerGatewayRouter } from "./server/providerGatewayRouter";\n'
          if import_line not in text:
              if import_marker not in text:
                  raise SystemExit('import marker not found')
              text = text.replace(import_marker, import_marker + import_line, 1)

          use_marker = '  app.use(express.urlencoded({ extended: true, limit: "10mb" }));\n\n'
          use_line = '  // Direct TMDB/AniList provider gateway: public JIT playback data, no iframe providers.\n  app.use(providerGatewayRouter());\n\n'
          if 'app.use(providerGatewayRouter());' not in text:
              if use_marker not in text:
                  raise SystemExit('middleware marker not found')
              text = text.replace(use_marker, use_marker + use_line, 1)
          p.write_text(text)
          PY
      - name: Direct provider contract tests
        run: npx vitest run server/providers/api/types.test.ts
      - name: Typecheck
        run: npm run lint
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: wire direct provider gateway into main API"
          git push origin HEAD:feat/provider-v2-es-multilang
