version: '3.8'

services:
  meristream-db:
    image: postgres:16-alpine
    container_name: meristream-db
    restart: always
    environment:
      POSTGRES_USER: voidstream
      POSTGRES_PASSWORD: voidstream123
      POSTGRES_DB: voidstream
    volumes:
      - meristream_pgdata:/var/lib/postgresql/data
      - ./meristream_db.dump:/tmp/meristream_db.dump:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voidstream -d voidstream"]
      interval: 5s
      timeout: 5s
      retries: 5

  meristream-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meristream-app
    restart: always
    environment:
      DATABASE_URL: "postgresql://voidstream:voidstream123@meristream-db:5432/voidstream?schema=public"
      TMDB_API_KEY: "4598f607660f5c4eb423d868da148981"
      PORT: "3010"
      NODE_ENV: "production"
    volumes:
      - /root/.ssh:/root/.ssh:ro          # SSH keys para git fetch desde GitHub
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket para docker restart
      - /var/log:/var/log                 # Log de auto-deploy
      - /opt/meristream:/opt/meristream   # Repositorio del proyecto
    ports:
      - "3010:3010"
    depends_on:
      meristream-db:
        condition: service_healthy

volumes:
  meristream_pgdata:
