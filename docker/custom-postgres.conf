# Conservative defaults for the catalog container. Override these values in a
# private deployment when the database host has more memory or CPU available.

# Memory
shared_buffers = 256MB
work_mem = 8MB
maintenance_work_mem = 256MB
effective_cache_size = 1GB

# Query Planner
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 200

# WAL (keep defaults for safety)
wal_buffers = 16MB

# Connection
max_connections = 50

# Autovacuum (more aggressive for busy DB)
autovacuum_max_workers = 3
autovacuum_naptime = 30s
